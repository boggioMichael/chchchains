<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הדמויות – דף לאישור</title>
<style>
  body { margin: 0; background: #f3efe6; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: #23201b; }
  #sheet { display: block; margin: 0 auto; }
</style>
</head>
<body>
<!-- A sheet of every candidate's portrait, with the list number and name, to send for approval. Serve the repository
     root (python3 -m http.server) and open /tools/art/portraits.html; ?small shows them at game size too. -->
<canvas id="sheet"></canvas>
<script type="module">
import { PEOPLE, drawPortrait } from '../../src/portraits.js';
const cols = 4;
const cell = 300;
const head = 170;
const rows = Math.ceil(PEOPLE.length / cols);
const c = document.getElementById('sheet');
c.width = cols * cell;
c.height = head + rows * cell + 60;
const g = c.getContext('2d');
g.fillStyle = '#f3efe6';
g.fillRect(0, 0, c.width, c.height);
g.textAlign = 'center';
g.direction = 'rtl';
g.fillStyle = '#23201b';
g.font = '900 54px system-ui, sans-serif';
g.fillText('הדמויות במשחק', c.width / 2, 78);
g.font = '600 26px system-ui, sans-serif';
g.fillStyle = 'rgba(35,32,27,0.7)';
g.fillText('ציורים מקוריים (לא תמונות). כל מועמד/ת מאשר/ת את הדמות שלו/ה לפני שהיא עולה למשחק.', c.width / 2, 124);
PEOPLE.forEach((p, i) => {
  const col = cols - 1 - (i % cols); // right to left
  const row = Math.floor(i / cols);
  const x = col * cell + (cell - 220) / 2;
  const y = head + row * cell;
  const pc = document.createElement('canvas');
  pc.width = pc.height = 220;
  drawPortrait(pc, p, 220);
  g.drawImage(pc, x, y);
  if (location.search.includes('small')) {
    const sc = document.createElement('canvas');
    sc.width = sc.height = 44;
    drawPortrait(sc, p, 44);
    g.drawImage(sc, x + 176, y + 176);
  }
  g.fillStyle = '#23201b';
  g.font = '800 28px system-ui, sans-serif';
  g.fillText(`${p.n}. ${p.name}`, col * cell + cell / 2, y + 256);
  if (!p.ready) {
    g.fillStyle = '#b4470b';
    g.font = '700 20px system-ui, sans-serif';
    g.fillText('טיוטה – מחכה לתמונה', col * cell + cell / 2, y + 284);
  }
});
document.body.dataset.ready = '1';
</script>
</body>
</html>
