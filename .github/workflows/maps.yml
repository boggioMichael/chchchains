# Builds the city maps (docs/maps) from OpenStreetMap and SRTM elevation, then commits them.
# Runs when the map tools change, or by hand from the Actions tab.
name: maps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/map/*.py', '.github/workflows/maps.yml']
permissions:
  contents: write
concurrency:
  group: maps
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install -q numpy scipy scikit-image pillow
      - name: Check the builder
        run: python tools/map/test_build.py
      - name: Build the maps
        run: python tools/map/build.py 2>&1 | tee tools/map/last-build.log
      - name: Commit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          git add docs/maps tools/map/last-build.log || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update the city maps from OpenStreetMap and SRTM'
          git push
