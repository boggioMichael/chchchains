# Builds the maps (docs/maps) from OpenStreetMap, SRTM elevation and Sentinel-2 imagery, then commits them.
# Runs when the map tools change (building whatever is missing or out of date), or by hand from the Actions tab.
name: maps
on:
  workflow_dispatch:
    inputs:
      only:
        description: Map ids to build, separated by spaces (empty = whatever is missing or out of date)
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['tools/map/*.py', '.github/workflows/maps.yml']
permissions:
  contents: write
concurrency:
  group: maps
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the newest maps, so a queued run skips what the one before it built
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install -q numpy scipy scikit-image pillow rasterio
      - name: Check the builder
        run: python tools/map/test_build.py && python tools/map/test_regions.py
      - name: Build the maps
        id: build
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          # A heartbeat: every 15 s the log so far, memory and the biggest processes go to the maps-log branch, so
          # a run that dies can still be read.
          (
            while sleep 15; do
              { tail -n 200 tools/map/last-build.log; echo; date -u; free -m; df -h . | tail -1; ps -eo rss,etime,args --sort=-rss | head -6; } > /tmp/beat.txt 2>&1
              tree=$(printf '100644 blob %s\tlog.txt\n' "$(git hash-object -w /tmp/beat.txt)" | git mktree)
              git push -qf origin "$(echo beat | git commit-tree "$tree"):refs/heads/maps-log" >/dev/null 2>&1
            done
          ) &
          beat=$!
          python -u tools/map/build.py $ONLY > tools/map/last-build.log 2>&1
          code=$?
          kill $beat
          echo "exit code $code" >> tools/map/last-build.log
          tail -n 60 tools/map/last-build.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit
        # The log goes in with the maps, so a failed build can be read from the repository.
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          git add docs/maps && git add -f tools/map/last-build.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update the maps from OpenStreetMap, SRTM and Sentinel-2'
          git pull --rebase origin main
          git push
      - name: Result
        if: steps.build.outputs.code != '0'
        run: exit 1
